# nginx sem root (imagem nginxinc/nginx-unprivileged): escuta em 8080 e grava
# pid e arquivos temporários só em /tmp (montado como tmpfs no compose).
# Este arquivo substitui o nginx.conf padrão da imagem; por isso não há include de conf.d.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # .mjs precisa de MIME JavaScript (o mime.types padrão não o cobre).
    # .wasm já vem mapeado em mime.types.
    types {
        application/javascript mjs;
    }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # Cabeçalhos de segurança no nível do servidor: valem para respostas geradas
    # aqui mesmo (400, 405 etc.). Locations com add_header próprio NÃO herdam
    # estes cabeçalhos, por isso cada location os repete.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Arquivos da raiz (index.html, coi-sw.js, hivebr-py.zip) são revalidados a cada carga.
        location / {
            try_files $uri $uri/ =404;

            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Assets com hash no nome: cache de um ano, imutável.
        # Asset ausente cai em @assets_missing, para o 404 não ficar cacheado como imutável.
        location /assets/ {
            try_files $uri @assets_missing;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location @assets_missing {
            return 404;

            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Healthcheck do compose. Não grava log de acesso.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";

            add_header Cache-Control "no-store" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
