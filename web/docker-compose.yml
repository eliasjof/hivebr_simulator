# Uso (a partir da raiz do repositório):
#   HIVEBR_BIND=127.0.0.1:3060 docker compose -f web/docker-compose.yml up -d --build
# HIVEBR_BIND define o endereço:porta publicado no host (padrão abaixo).

name: hivebr

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: hivebr-web:local
    restart: unless-stopped
    ports:
      - "${HIVEBR_BIND:-172.16.0.1:3060}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
