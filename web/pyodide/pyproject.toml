[project]
name = "hivebr-web-core"
version = "0.1.0"
description = "hivebr simulator core for Pyodide/WASM - pure Python simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elias J. R. Freitas" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pyodide-build>=0.26.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../../src"]
include = ["hivebr*"]

[tool.pyodide]
packages = ["numpy", "pyyaml", "scipy", "hivebr-web-core"]